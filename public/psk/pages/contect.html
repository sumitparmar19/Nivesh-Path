<!DOCTYPE html>
<!-- Contact: a form that is saved to MongoDB and emailed to the owner (POST /api/contact), plus the
     owner's real links. Works with or without login. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nivesh-Path</title>
    <meta name="description" content="Send feedback or a question about Nivesh-Path.">
    <link rel="stylesheet" href="/psk/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/nivesh.css">
    <link rel="icon" href="/psk/finallogo.png">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><img src="/psk/finallogo.png" alt="Nivesh-Path home"></a>
        <div class="nav-links" data-np-nav></div>
    </nav>

    <main class="np-doc">
        <header class="np-page-head">
            <div>
                <p class="np-eyebrow">Contact</p>
                <h1>Get in touch</h1>
                <p class="np-lede">Feedback, a bug, or a question about the project? Your message goes straight to Sumit.</p>
            </div>
        </header>

        <div class="np-grid-2">
            <form class="np-card np-card-pad np-form" id="contactForm" novalidate>
                <div class="np-form-grid">
                    <label>Your name<input name="name" autocomplete="name" maxlength="100" required></label>
                    <label>Your email<input name="email" type="email" autocomplete="email" maxlength="200" required></label>
                    <label class="np-span-2">Topic
                        <select name="subject" class="np-select">
                            <option>Feedback</option>
                            <option>Bug report</option>
                            <option>Question</option>
                            <option>Hiring / collaboration</option>
                        </select>
                    </label>
                    <label class="np-span-2">Message<textarea name="message" rows="6" maxlength="5000" required placeholder="What's on your mind?"></textarea></label>
                </div>
                <button type="submit" class="np-btn"><i class="fas fa-paper-plane"></i> Send message</button>
            </form>

            <aside class="np-card np-card-pad">
                <h2 style="margin:0 0 12px;font-size:1.15rem">Other ways to reach me</h2>
                <ul class="np-checks">
                    <li><span><i class="fab fa-github"></i> GitHub</span><b><a class="np-link" href="https://github.com/sumitparmar19" target="_blank" rel="noopener">sumitparmar19</a></b></li>
                    <li><span><i class="fab fa-linkedin"></i> LinkedIn</span><b><a class="np-link" href="https://www.linkedin.com/in/sumit-parmar-07a544278" target="_blank" rel="noopener">Sumit Parmar</a></b></li>
                    <li><span><i class="fas fa-circle-question"></i> Common questions</span><b><a class="np-link" href="/psk/pages/about.html#faq">FAQ</a></b></li>
                </ul>
                <p class="np-muted" style="margin:14px 0 0;font-size:.88rem">Messages are stored securely and only read by the project owner.</p>
            </aside>
        </div>
    </main>

    <footer data-np-footer></footer>
    <script src="/assets/nivesh.js" defer></script>
    <script src="/psk/js/contact.js" defer></script>
</body>
</html>
