<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Nivesh Path</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/nivesh.css">
    <link rel="icon" href="/psk/finallogo.png">
</head>
<body>
    <div class="signup-container">
        <div class="signup-form">
            <div class="signup-logo">
                <img src="/psk/finallogo.png" alt="Nivesh Path logo">
                <div class="logo-text"></div>
            </div>
            <h2>Create your account</h2>
            <p class="np-auth-sub">Start investing smarter in under a minute.</p>
            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" autocomplete="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile number</label>
                    <input type="tel" id="mobile" autocomplete="tel" placeholder="Mobile number" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required>
                </div>
                <button type="submit" class="submit-button">Create account</button>
            </form>
            <p class="login-text">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
    
    <script src="/assets/nivesh.js" defer></script>
    <script src="../js/signup.js" defer></script>
</body>
</html>
