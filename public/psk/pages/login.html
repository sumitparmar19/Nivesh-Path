<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nivesh Path</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/nivesh.css">
    <link rel="icon" href="/psk/finallogo.png">
</head>
<body>
    <div class="signup-container">
        <div class="signup-form">
            <div class="signup-logo">
                <img src="/psk/finallogo.png" alt="Nivesh Path logo">
                <div class="logo-text"></div>
            </div>
            <h2>Welcome back</h2>
            <p class="np-auth-sub">Log in to track your portfolio and get AI insights.</p>
            <form id="loginForm" method="POST">
                <div class="form-group">
                    <label for="loginId">Email or mobile number</label>
                    <input type="text" id="loginId" autocomplete="username" placeholder="you@example.com or mobile" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" placeholder="Your password" required>
                </div>
                <button type="submit" class="submit-button">Log in</button>
            </form>
            <p class="login-text">Don't have an account? <a href="signup.html">Sign up now</a></p>
        </div>
    </div>

    <script src="/assets/nivesh.js" defer></script>
    <script src="../js/login.js" defer></script>
</body>
</html>
