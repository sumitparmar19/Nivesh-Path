<!DOCTYPE html>
<!-- Markets: search any US stock or ETF, popular stocks at live prices, and 50+ curated stocks by sector.
     Every card and row opens our own stock page (never an outside site). Data: /api/stocks/*. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markets | Nivesh-Path</title>
    <meta name="description" content="Search US stocks and ETFs, see live prices and open any stock to paper-trade it on Nivesh-Path.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/assets/nivesh.css">
    <link rel="icon" href="/psk/finallogo.png">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">
            <img src="/psk/finallogo.png" alt="Nivesh Path logo">
        </a>
        <div class="nav-links" data-np-nav></div>
    </nav>

    <div class="main">
        <div class="nav1">
            <div class="sidebar">
                <div class="nav-menu" data-np-sidebar></div>
            </div>
        </div>



        <section class="np-page">
            <header class="np-page-head">
                <div>
                    <p class="np-eyebrow">Markets</p>
                    <h1>Find a stock</h1>
                    <p class="np-lede">Live prices for popular US stocks and ETFs. Search any NYSE or NASDAQ ticker to open it and trade with virtual cash.</p>
                </div>
            </header>

            <div class="np-market-search" role="search">
                <label class="np-search np-search--lg">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="stockSearch" placeholder="Search by company or ticker, e.g. Apple or XOM" autocomplete="off"
                           aria-label="Search stocks" aria-controls="searchResults" aria-expanded="false">
                </label>
                <ul class="np-search-results" id="searchResults" role="listbox" hidden></ul>
            </div>

            <section>
                <div class="np-card-head"><h2><i class="fas fa-fire"></i> Popular right now</h2><span class="np-muted" style="font-size:.85rem" id="popularUpdated"></span></div>
                <div class="np-popular" id="popular"></div>
            </section>

            <div class="np-grid-2">
                <section class="np-card np-card-pad">
                    <div class="np-card-head"><h2><i class="fas fa-arrow-trend-up"></i> Top gainers today</h2></div>
                    <div class="np-stock-list" id="gainers"><p class="np-muted">Loading…</p></div>
                </section>
                <section class="np-card np-card-pad">
                    <div class="np-card-head"><h2><i class="fas fa-arrow-trend-down"></i> Top losers today</h2></div>
                    <div class="np-stock-list" id="losers"><p class="np-muted">Loading…</p></div>
                </section>
            </div>

            <section class="np-card np-card-pad">
                <div class="np-card-head">
                    <h2><i class="fas fa-layer-group"></i> Browse by sector</h2>
                    <span class="np-muted" style="font-size:.85rem" id="curatedCount"></span>
                </div>
                <div class="np-segment np-segment--wrap" role="tablist" aria-label="Sectors" id="sectorTabs"></div>
                <div class="np-stock-list" id="sectorList" style="margin-top:14px"><p class="np-muted">Loading…</p></div>
            </section>

            <footer data-np-footer></footer>
        </section>
    </div>

    <script src="/assets/nivesh.js" defer></script>
    <script src="/markets.js" defer></script>
</body>
</html>
