# Infrastructure checks (Phase 3, PR E) on every push/PR that touches infra/ or the AWS workflows:
#   terraform fmt + validate for every stack, Checkov (every finding fixed or skipped in the code with a reason),
#   ShellCheck on the deploy script; and on pull requests, `terraform plan` for the demo stack posted as a comment.
# The plan job signs in with the READ-ONLY plan role (OIDC, no keys) and is skipped until Sumit has run the
# bootstrap and set the AWS_PLAN_ROLE_ARN variable (docs/AWS.md), so CI stays green before AWS exists.
name: Infra

on:
  push:
    branches: [main, "claude/**"]
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/workflows/aws-demo-*.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml", ".github/workflows/aws-demo-*.yml"]

permissions:
  contents: read

env:
  TF_VERSION: 1.15.9
  CHECKOV_VERSION: 3.3.15
  TF_VAR_certificate_arn: ${{ vars.AWS_DEMO_CERTIFICATE_ARN }} # empty = HTTP only

jobs:
  checks:
    name: Terraform fmt/validate, Checkov, ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      - name: terraform validate (every stack)
        run: |
          for stack in infra/bootstrap infra/demo; do
            echo "== $stack"
            terraform -chdir="$stack" init -backend=false -input=false -lockfile=readonly >/dev/null
            terraform -chdir="$stack" validate
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkov (security scan)
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d infra --framework terraform --quiet --compact --skip-path '\.terraform' --external-checks-dir infra/checkov
      - name: ShellCheck
        run: shellcheck infra/scripts/*.sh infra/bootstrap/*.sh

  plan:
    name: Terraform plan (demo) as a PR comment
    needs: checks
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC sign-in to the read-only plan role
      pull-requests: write # the plan comment
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: terraform plan (read-only, no state lock)
        id: plan
        run: |
          BUCKET="nivesh-path-tfstate-$(aws sts get-caller-identity --query Account --output text)"
          terraform -chdir=infra/demo init -input=false -lockfile=readonly -backend-config="bucket=$BUCKET" >/dev/null
          set +e
          terraform -chdir=infra/demo plan -lock=false -input=false -no-color -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 1 ]; then exit 1; fi
      - name: Post the plan on the PR
        if: always() && steps.plan.outputs.exitcode != ''
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- infra-demo-plan -->";
            let plan = fs.readFileSync("plan.txt", "utf8");
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ["(see the job log)"])[0];
            if (plan.length > 60000) plan = "…(truncated; full plan in the job log)\n" + plan.slice(-60000);
            const status = { "0": "No changes", "2": "Changes", "1": "Plan FAILED" }[process.env.EXIT_CODE] || "Unknown";
            const body = [
              marker,
              `### Terraform plan · infra/demo · ${status}`,
              `\`${summary}\` · commit ${context.sha.slice(0, 7)} · read-only plan role, no state lock`,
              "<details><summary>Full plan</summary>\n\n```\n" + plan + "\n```\n</details>",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
