# CI: test both services on every push/PR, build Docker images, and publish them to GHCR from main.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  ai-service:
    name: AI service tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: React app (typecheck, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end smoke test (Playwright)
    needs: [frontend]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017/nivesh_e2e
      JWT_SECRET: e2e-only-secret
      FAKE_MARKET_DATA: "1" # made-up prices: CI has no Finnhub key
      AI_SERVICE_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: npm ci
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start the AI service (rule-based, no Claude key)
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          nohup uvicorn main:app --port 8001 > ../ai.log 2>&1 &
      - name: Start the web server
        run: nohup node server.js > web.log 2>&1 &
      - name: Wait for both services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && curl -sf http://localhost:8001/health && exit 0
            sleep 2
          done
          echo "services did not start"; cat web.log ai.log; exit 1
      - run: npx playwright test
        working-directory: frontend
      - name: Server logs
        if: failure()
        run: cat web.log ai.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Build Docker images
    needs: [backend, ai-service, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image names
        id: names
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/nivesh-path-backend:latest
      - name: AI service image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.names.outputs.owner }}/nivesh-path-ai:latest
