# DigitalOcean App Platform spec (GitHub Student Pack credit).
# Deploy: DigitalOcean dashboard -> Apps -> Create App -> "Import from app spec" (or `doctl apps create --spec .do/app.yaml`).
# Changing this file does NOT change the live app: paste edits into Settings -> App Spec -> Edit (DigitalOcean).
# Secrets are NOT listed here: add them in the dashboard (Settings -> component -> Environment Variables, tick Encrypt):
#   web:     MONGO_URL, FINNHUB_API_KEY, JWT_SECRET, AI_INTERNAL_TOKEN, DATABASE_URL (Neon pooled, with pgbouncer=true),
#            SENTRY_DSN (optional), RESEND_API_KEY + CONTACT_TO_EMAIL (optional)
#   migrate: DATABASE_URL (same as web), DIRECT_URL (Neon direct, for migrations)
#   ai:      ANTHROPIC_API_KEY, MONGO_URL (behavioral pattern results), AI_INTERNAL_TOKEN (same value as web: the AI
#            service then only answers the web component, and it reads trades from web's /internal API), SENTRY_DSN
# Cutover switches (web, see docs/PHASE3_REVIEW.md 2.4): LEDGER_BACKEND=mongo|postgres, LEDGER_MAINTENANCE=1.
# Observability (both components, docs/OBSERVABILITY.md): OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS (SECRET),
#   OTEL_SERVICE_NAME (nivesh-web | nivesh-ai), OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production.
name: nivesh-path
region: nyc
services:
  - name: web
    github:
      repo: sumitparmar19/Nivesh-Path
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: AI_SERVICE_URL
        value: ${ai.PRIVATE_URL}
      - key: PUBLIC_BASE_URL
        value: ${APP_URL}
      - key: LEDGER_BACKEND
        value: mongo

  - name: ai
    github:
      repo: sumitparmar19/Nivesh-Path
      branch: main
      deploy_on_push: true
    source_dir: ai-service
    dockerfile_path: ai-service/Dockerfile
    internal_ports:
      - 8001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      port: 8001
    envs:
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: WEB_INTERNAL_URL
        value: ${web.PRIVATE_URL}

jobs:
  # Applies new Postgres ledger migrations before each deploy. If it fails, the deploy stops and the running
  # version stays up (a migration in the run command would crash-loop the live container instead).
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: sumitparmar19/Nivesh-Path
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npx --no-install prisma migrate deploy
