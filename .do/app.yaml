# DigitalOcean App Platform spec (GitHub Student Pack credit).
# Deploy: DigitalOcean dashboard -> Apps -> Create App -> "Import from app spec" (or `doctl apps create --spec .do/app.yaml`).
# Secrets are NOT listed here: add them in the dashboard (Settings -> component -> Environment Variables, tick Encrypt):
#   web: MONGO_URL, FINNHUB_API_KEY, JWT_SECRET, SENTRY_DSN (optional)
#   ai:  ANTHROPIC_API_KEY, SENTRY_DSN (optional)
name: nivesh-path
region: nyc
services:
  - name: web
    github:
      repo: sumitparmar19/Nivesh-Path
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    routes:
      - path: /
    envs:
      - key: AI_SERVICE_URL
        value: ${ai.PRIVATE_URL}
      - key: PUBLIC_BASE_URL
        value: ${APP_URL}

  - name: ai
    github:
      repo: sumitparmar19/Nivesh-Path
      branch: main
      deploy_on_push: true
    source_dir: ai-service
    dockerfile_path: ai-service/Dockerfile
    internal_ports:
      - 8001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      port: 8001
    envs:
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
