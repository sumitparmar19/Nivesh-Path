# Runs the full Nivesh-Path stack locally: `docker compose up --build`, then open http://localhost:3000
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/niveshpath
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8001
      PUBLIC_BASE_URL: http://localhost:3000
      # Postgres ledger (Phase 3). LEDGER_BACKEND comes from .env (mongo by default).
      DATABASE_URL: postgresql://nivesh:nivesh@postgres:5432/nivesh
      DIRECT_URL: postgresql://nivesh:nivesh@postgres:5432/nivesh
    # Apply any new ledger migrations, then start (on DigitalOcean a pre-deploy job does the migrate step).
    command: ["sh", "-c", "npx --no-install prisma migrate deploy && node server.js"]
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    ports:
      - "127.0.0.1:8001:8001" # this machine only; the backend reaches it over the compose network
    env_file: .env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma
      # Behavioral pattern results live in MongoDB; trades are read through the web service's /internal API
      # (needs AI_INTERNAL_TOKEN in .env; without it the AI service reads `purchases` from MongoDB directly).
      MONGO_URL: mongodb://mongo:27017/niveshpath
      WEB_INTERNAL_URL: http://backend:3000
    volumes:
      - chroma_data:/data/chroma
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine # same major as production (Neon runs 18)
    environment:
      POSTGRES_USER: nivesh
      POSTGRES_PASSWORD: nivesh # local only; never exposed outside the compose network
      POSTGRES_DB: nivesh
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/... and expect the volume one level up.
      # A new volume name: data from the old Postgres 16 volume can't be opened by 18 (local test data only).
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivesh -d nivesh"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18_data:
  mongo_data:
  chroma_data:
